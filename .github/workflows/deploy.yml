name: Deploy (manual, disabled)

# Future CD path. Nothing here runs automatically:
#  - `publish` only runs when started by hand and pushes an image tagged with the commit SHA to GHCR.
#  - `deploy` additionally requires the repository variable DEPLOY_ENABLED=true and approval on the
#    `demo` environment. Neither exists yet, so the job is skipped. See docs/DEPLOYMENT.md.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Also deploy the published image (requires DEPLOY_ENABLED and environment approval)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: ref
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.ref.outputs.image }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
      - run: |
          echo "Published ${{ steps.ref.outputs.image }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: publish
    if: ${{ inputs.deploy && vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: demo
    steps:
      - name: Deploy pinned digest over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          IMAGE: ${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh -i ~/.ssh/deploy "deploy@$SSH_HOST" "cd /srv/signalpost && ./deploy.sh '$IMAGE'"
      - name: Smoke test
        env:
          PUBLIC_URL: ${{ vars.DEMO_URL }}
        run: curl --fail --silent --show-error --max-time 10 "$PUBLIC_URL/readyz"
